[build]
  command = "pnpm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.16.0"
  PNPM_FLAGS = "--filter dxwz-frontend... --filter s7-control-functions..."
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "@netlify/database", "@netlify/functions", "@netlify/identity"]

[dev]
  command = "pnpm --filter dxwz-frontend dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https://localhost:18443; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
