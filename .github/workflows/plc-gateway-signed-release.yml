name: PLC Gateway Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - "plc-gateway-v*"

jobs:
  build-sign-verify:
    runs-on: windows-latest
    environment: production-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter s7-plc-gateway test
      - name: Require production signing credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw 'Missing GitHub Secret: WIN_CSC_LINK.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Missing GitHub Secret: WIN_CSC_KEY_PASSWORD.'
          }
      - name: Build formally signed Windows installer
        run: pnpm --filter s7-plc-gateway package:win:signed
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify Authenticode publisher and timestamp
        shell: pwsh
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          ./plc-gateway/scripts/verify-signatures.ps1 -Path @(
            'plc-gateway/release/win-unpacked/S7 Control PLC Gateway.exe',
            'plc-gateway/release/S7-Control-PLC-Gateway-*-x64.exe'
          )
      - uses: actions/upload-artifact@v4
        with:
          name: s7-control-plc-gateway-windows-signed
          path: plc-gateway/release/S7-Control-PLC-Gateway-*-x64.exe
          if-no-files-found: error
          retention-days: 30
