name: PLC Gateway Windows

on:
  pull_request:
    paths:
      - "plc-gateway/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/plc-gateway.yml"
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter s7-plc-gateway test
      - run: pnpm --filter s7-plc-gateway package:win
      - uses: actions/upload-artifact@v4
        with:
          name: s7-control-plc-gateway-windows
          path: plc-gateway/release/*.exe
          if-no-files-found: error
